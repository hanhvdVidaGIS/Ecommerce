# Triển khai production bằng Docker Compose: một máy chủ chạy đủ DB + API + Storefront + Admin + cổng nginx.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Biến bắt buộc trong .env: POSTGRES_PASSWORD, JWT_KEY, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD, REVALIDATE_SECRET (xem .env.example, docs/DEPLOY.md).
name: ccp-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-ccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong file .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccp} -d ${POSTGRES_DB:-ccp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-ccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_KEY: ${JWT_KEY:?Đặt JWT_KEY (>= 32 ký tự) trong file .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?}
      Seed__Demo: ${Seed__Demo:-false}
      # Chạy migration khi khởi động (an toàn với một bản sao API). Nếu chạy nhiều bản sao, đặt false và migrate chủ động.
      Database__AutoMigrate: ${Database__AutoMigrate:-true}
      # Phía sau nginx: tin tiêu đề X-Forwarded-* để biết IP thật (giới hạn tần suất, nhật ký)
      ForwardedHeaders__Enabled: "true"
      # Gửi email thật (quên mật khẩu, xác nhận đơn). Bỏ trống SMTP_HOST thì chỉ ghi nhật ký.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Storefront__RevalidateUrl: http://storefront:3000/revalidate
      Storefront__RevalidateSecret: ${REVALIDATE_SECRET:?Đặt REVALIDATE_SECRET trong file .env}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  storefront:
    build:
      context: ./storefront
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://api:8080
      # Địa chỉ công khai (canonical, sitemap, Open Graph): ví dụ https://shop.example.com
      SITE_URL: ${SITE_URL:?Đặt SITE_URL (địa chỉ công khai của cửa hàng) trong file .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
    networks: [internal]

  admin:
    build: ./admin
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, storefront, admin]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

networks:
  internal:

volumes:
  db-data:
  uploads:
