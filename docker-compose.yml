name: ccp

services:
  db:
    image: postgres:17-alpine
    container_name: ccp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccp}
      POSTGRES_USER: ${POSTGRES_USER:-ccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong file .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ccp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccp} -d ${POSTGRES_DB:-ccp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ccp-db-data:
