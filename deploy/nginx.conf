# Cổng vào duy nhất của hệ thống: cùng một tên miền cho Storefront, Admin và API
# (cookie HttpOnly + CSRF cùng nguồn gốc, không cần CORS).
# TLS: đặt chứng chỉ tại đây hoặc đặt bộ cân bằng tải/Cloudflare phía trước; cookie đăng nhập ở môi trường Production có cờ Secure nên BẮT BUỘC dùng HTTPS.

# Giữ X-Forwarded-Proto do bộ cân bằng tải/TLS phía trước gửi; nếu không có thì dùng giao thức của kết nối tới nginx
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

upstream api        { server api:8080; }
upstream storefront { server storefront:3000; }
upstream admin      { server admin:80; }

# Cho phép tải lên tới 150 MB (video tối đa 100 MB trong một yêu cầu nhiều tệp, khớp RequestSizeLimit của MediaController)
client_max_body_size 150m;

# Chống dò mật khẩu/đặt hàng ở lớp ngoài, bổ sung cho giới hạn trong API
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_http_version 1.1;

  # Chỉ các điểm cuối dò được mật khẩu/email; /api/auth/me và /refresh được gọi thường xuyên nên không giới hạn ở đây
  location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api;
  }

  location /api/ { proxy_pass http://api; }

  location /uploads/ {
    proxy_pass http://api;
    proxy_cache_valid 200 7d;
  }

  location /health { proxy_pass http://api; access_log off; }

  location = /admin { return 301 /admin/; }
  location /admin/ { proxy_pass http://admin; }

  # Cấu hình làm mới đệm: chỉ API (mạng nội bộ) được gọi, không mở ra Internet
  location = /revalidate { return 404; }

  location / { proxy_pass http://storefront; }
}
